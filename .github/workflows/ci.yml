name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Check, build and validate Astro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Astro type and content checks
        run: yarn check:astro
      - name: Production build
        run: yarn build:astro
      - name: Static build validation
        run: yarn validate:astro
