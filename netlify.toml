# Pin the Node.js version Netlify builds with to the line we develop on
# (local dev/CI machines run Node 22; see docs/vertical-seo-build.md).
[build.environment]
  NODE_VERSION = "22"
  # The site was migrated from Next.js to Astro. @netlify/plugin-nextjs was
  # auto-installed at the site level (plugin "from Netlify app") and keeps
  # failing in onBuild against the static astro/dist output. This opt-out
  # makes the plugin no-op until it is uninstalled in the Netlify dashboard.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# The repository root is the Yarn workspace root; Astro is rooted in astro/.
[build]
  command = "yarn build:astro && yarn check:blog"
  publish = "astro/dist"

# Security headers for every response. Netlify applies the most specific
# matching rule, so the cache-only rules below still apply to their own paths.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    # HSTS: includeSubDomains is enabled. `preload` is deliberately left out
    # until every infused.agency subdomain is confirmed HTTPS-only; preload is
    # hard to undo. To opt in later, append `; preload` to the value below and
    # submit the domain at https://hstspreload.org/.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Report-Only first because the site currently has one inline <script> and
    # inline style attributes. Switch the header name to
    # `Content-Security-Policy` (and remove Report-Only) after reviewing reports.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src https://calendly.com https://maps.google.com https://www.google.com; upgrade-insecure-requests"

# Static assets are content-stable between deploys. Give browsers a long cache
# lifetime so repeat visits do not re-download images, fonts or hashed bundles.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"
